{% extends "base.html" %}

{% block title %}
CareerPilot AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-body text-center p-5">

                <h1 class="display-4 fw-bold text-primary">
                    🚀 CareerPilot AI
                </h1>

                <p class="lead mt-3">
                    Upload your resume and receive an AI-powered ATS analysis,
                    interview questions, career advice, and improvement suggestions.
                </p>

                <form
                    action="/upload"
                    method="POST"
                    enctype="multipart/form-data"
                    class="mt-5">

                    <input
                        class="form-control form-control-lg"
                        type="file"
                        name="resume"
                        accept=".pdf"
                        required>

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg px-5">

                            <i class="bi bi-stars"></i>

                            Analyze Resume

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
