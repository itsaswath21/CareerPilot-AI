<!-- REAL JOB RECOMMENDATIONS -->

<div class="card shadow border-0 rounded-4 mt-4">

    <div class="card-body p-4">

        <h4>💼 Live Job Recommendations</h4>

        <hr>

        <div class="row">

            {% for job in jobs %}

            <div class="col-md-6 mb-3">

                <div class="card h-100 border-primary">

                    <div class="card-body">

                        <h5 class="fw-bold">

                            {{ job.title }}

                        </h5>

                        <p>

                            🏢 {{ job.company }}

                        </p>

                        <p>

                            📍 {{ job.location }}

                        </p>

                        <p>

                            💰 {{ job.salary }}

                        </p>

                        <a
                            href="{{ job.url }}"
                            target="_blank"
                            class="btn btn-primary">

                            Apply Now →

                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</div>
